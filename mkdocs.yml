site_name: ONVIF Python
site_description: >-
  A modern Python library for ONVIF-compliant IP cameras and devices, providing a clean,
  typed API for discovery, device management, media, PTZ, and events.
site_url: https://nirsimetri.github.io/onvif-python/
repo_url: https://github.com/nirsimetri/onvif-python
repo_name: nirsimetri/onvif-python
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/nirsimetri-light.svg
  favicon: assets/nirsimetri-dark.svg
  icon:
    repo: fontawesome/brands/github
    admonition:
      example: material/code-tags
      danger: material/skull
      bug: material/flask-outline
      note: material/book-open-variant
      tip: material/source-pull
      info: material/lightbulb
      abstract: material/feature-search
      warning: material/traffic-cone
      question: material/telescope
      success: material/check-circle
      failure: material/cancel
  font:
    text: Manrope
    code: JetBrains Mono
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.footnote.tooltips
    - navigation.path
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.footer
    - navigation.prune
    - search.highlight
    - search.suggest
    - toc.follow
    
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-on-10
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/lightbulb-on-90
        name: Switch to light mode

nav:
  - Home: index.md
  - Get Started:
    - Philosophy: philosophy.md
    - Installation: installation.md
    - Quickstart: quick_start.md
    - Main Features:
      - Client: main/onvif_client.md
      - CLI: main/onvif_cli.md
    - Utilities:
      - Helper Methods: utilities/helper_methods.md
  - Reference:
    - ONVIF Profiles:
      - Supports: references/supported_profiles.md
    - ONVIF Services:
      - Coverage: references/implemented_services.md
      - Discovery: references/service_discovery.md
      - Bindings: references/service_bindings.md
  - API:
    - api/index.md
    - Core:
      - api/core/index.md
      - ONVIFClient: api/core/onvif_client.md
      - ONVIFOperator: api/core/onvif_operator.md
    - Exceptions:
      - api/exceptions/index.md
      - ONVIFOperationException: api/exceptions/onvif_exception.md
      - Error Handlers: api/exceptions/onvif_error_handlers.md
    - Utilities:
      - api/utilities/index.md
      - ONVIFDiscovery: api/utilities/onvif_discovery.md
      - CacheMode: api/utilities/cache_mode.md
      - ONVIFWSDL: api/utilities/onvif_wsdl.md
      - ONVIFService: api/utilities/onvif_service.md
      - ZeepPatcher: api/utilities/zeep_patcher.md
      - Plugins: api/utilities/plugins.md
    - Services:
      - api/services/index.md
      - Device: api/services/device.md
      - Events:
        - api/services/events/index.md
        - PullPoint: api/services/events/pullpoint.md
        - Notification: api/services/events/notification.md
        - Subscription: api/services/events/subscription.md
        - PausableSubscription: api/services/events/pausable_subscription.md
      - Imaging: api/services/imaging.md
      - Media: api/services/media.md
      - Media2: api/services/media2.md
      - PTZ: api/services/ptz.md
      - Provisioning: api/services/provisioning.md
      - DeviceIO: api/services/deviceio.md
      - Display: api/services/display.md
      - Thermal: api/services/thermal.md
      - Analytics:
        - api/services/analytics/index.md
        - RuleEngine: api/services/analytics/ruleengine.md
      - AnalyticsDevice: api/services/analyticsdevice.md
      - Receiver: api/services/receiver.md
      - Recording: api/services/recording.md
      - Search: api/services/search.md
      - Replay: api/services/replay.md
      - ActionEngine: api/services/actionengine.md
      - Schedule: api/services/schedule.md
      - AccessControl: api/services/accesscontrol.md
      - DoorControl: api/services/doorcontrol.md
      - AccessRules: api/services/accessrules.md
      - AuthenticationBehavior: api/services/authenticationbehavior.md
      - Credential: api/services/credential.md
      - Security:
        - api/services/security/index.md
        - AuthorizationServer: api/services/security/authorizationserver.md
        - Dot1x: api/services/security/dot1x.md
        - JWT: api/services/security/jwt.md
        - KeyStore: api/services/security/keystore.md
        - MediaSigning: api/services/security/mediasigning.md
        - TLSServer: api/services/security/tlsserver.md
      - AppManagement: api/services/appmgmt.md
      - Uplink: api/services/uplink.md
  - Project:
    - Contributing: project/contributing.md
    - Roadmap: project/roadmap.md
    - Used By: project/used_by.md
    - External: project/external.md
  - Legal:
    - Notice: legal/notice.md
    - License: legal/license.md
  - Releases: releases.md  # It will be hidden because it serves as a placeholder.

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      js_files:
        - javascripts/github-releases.js
        - javascripts/external-links.js
      css_files:
        - stylesheets/extra.css
  - git-revision-date-localized:
      exclude:
        - releases.md
      type: timeago
      enable_creation_date: true
  - git-authors:
      exclude:
        - releases.md
      show_contribution: true
      show_email_address: false
      sort_authors_by: contribution
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            show_root_full_path: false
            show_root_toc_entry: false
            show_signature_annotations: true

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.tilde
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums_style: pymdownx-inline
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  links:
    absolute_links: ignore
    anchors: ignore

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://nirsimetri.com
      name: Website

    - icon: fontawesome/brands/github
      link: https://github.com/nirsimetri
      name: GitHub

    - icon: fontawesome/brands/python
      link: https://pypi.org/project/onvif-python/
      name: PyPI

    - icon: fontawesome/brands/x-twitter
      link: https://x.com/nirsimetri
      name: X

    - icon: fontawesome/brands/mastodon
      link: https://fosstodon.org/@nirsimetri
      name: Mastodon

    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/nirsimetri-technologies
      name: LinkedIn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/marked/marked.min.js
  - https://cdn.jsdelivr.net/npm/dompurify@3.4.15/dist/purify.min.js
  - javascripts/github-releases.js
  - javascripts/external-links.js

hooks:
  - docs/hooks.py

copyright: >-
  Copyright &copy; 2026 &nbsp;—&nbsp; <a href="https://github.com/nirsimetri"><b>Nirsimetri Technologies®</b></a>