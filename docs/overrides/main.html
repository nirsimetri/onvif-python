{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <!-- Open Graph -->
  <meta property="og:title" content="ONVIF Python / Python Library for ONVIF Devices" />
  <meta
    property="og:description"
    content="A modern Python library for ONVIF-compliant IP cameras and devices."
  />
  <meta property="og:site_name" content="ONVIF Python" />
  <meta property="og:type" content="website" />
  <meta
    property="og:url"
    content="https://onvif-python.nirsimetri.workers.dev/"
  />
  <meta
    property="og:image"
    content="https://raw.githubusercontent.com/nirsimetri/onvif-python/refs/heads/main/assets/images/onvif_cli.png"
  />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta
    name="twitter:title"
    content="ONVIF Python / Python Library for ONVIF Devices"
  />
  <meta
    name="twitter:description"
    content="A modern Python library for ONVIF-compliant IP cameras and devices."
  />
  <meta
    name="twitter:image"
    content="https://raw.githubusercontent.com/nirsimetri/onvif-python/refs/heads/main/assets/images/onvif_cli.png"
  />

  <!-- Google Search Console -->
  {% if config.extra.google_site_verification %}
    <meta
      name="google-site-verification"
      content="{{ config.extra.google_site_verification }}"
    />
  {% endif %}

  <!-- Google tag (gtag.js) -->
  {% if config.extra.google_analytics_id %}
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id={{ config.extra.google_analytics_id }}"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "{{ config.extra.google_analytics_id }}");
    </script>
  {% endif %}

  <!-- Cloudflare Web Analytics -->
  {% if config.extra.cloudflare_beacon %}
    <script 
      type='module' 
      src='https://static.cloudflareinsights.com/beacon.min.js' 
      data-cf-beacon='{"token": "{{ config.extra.cloudflare_beacon }}"}'
    >
    </script>
  {% endif %}
   <!-- End Cloudflare Web Analytics -->
{% endblock %}
