{% if page.meta.comments %}
  <h2 id="__comments">{{ lang.t("meta.comments") }}</h2>
    
    <script>
        var palette = __md_get("__palette");

        var giscusTheme =
        palette && palette.color && palette.color.scheme === "slate"
            ? "dark"
            : "light";

        var giscusScript = document.createElement("script");

        giscusScript.src = "https://giscus.app/client.js";
        giscusScript.dataset.repo = "nirsimetri/onvif-python";
        giscusScript.dataset.repoId = "R_kgDOP2QG1A";
        giscusScript.dataset.category = "Comments";
        giscusScript.dataset.categoryId = "DIC_kwDOP2QG1M4DIh0b";
        giscusScript.dataset.mapping = "title";
        giscusScript.dataset.strict = "1";
        giscusScript.dataset.reactionsEnabled = "1";
        giscusScript.dataset.emitMetadata = "0";
        giscusScript.dataset.inputPosition = "top";
        giscusScript.dataset.theme = giscusTheme;
        giscusScript.dataset.lang = "en";
        giscusScript.dataset.loading = "lazy";
        giscusScript.crossOrigin = "anonymous";
        giscusScript.async = true;

        document.currentScript.after(giscusScript);
    </script>

    <!-- Synchronize Giscus theme with palette -->
    <script>
        function syncGiscusTheme() {
            var palette = __md_get("__palette");

            if (!palette || typeof palette.color !== "object") {
                return;
            }

            var theme = palette.color.scheme === "slate"
                ? "dark"
                : "light";

            var frame = document.querySelector(".giscus-frame");

            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage(
                    { giscus: { setConfig: { theme: theme } } },
                    "https://giscus.app"
                );
            }
        }

        // Synchronize theme on initial load and instant navigation.
        document$.subscribe(function() {
            var ref = document.querySelector(
                "[data-md-component=palette]"
            );

            if (ref && !ref.dataset.giscusThemeSync) {
                ref.dataset.giscusThemeSync = "true";
                ref.addEventListener("change", syncGiscusTheme);
            }

            syncGiscusTheme();
        });
    </script>
{% endif %}
