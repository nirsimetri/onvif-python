[build-system]
requires = [
    "setuptools>=77.0.3",
    "wheel>=0.48.0,<1.0.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "onvif-python"
version = "0.4.4"
description = "A modern Python library for ONVIF-compliant devices"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Nirsimetri Technologies®", email = "open@nirsimetri.com"},
]
maintainers = [
    {name = "Kaburagi"},
]
keywords = [
    "onvif", "Camera", "onvif python", "ip camera",
    "cctv", "soap", "surveillance", "cctv cameras",
    "soap client", "onvif client", "onvif library",
    "onvif specifications"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Communications",
    "Topic :: Text Processing :: Markup :: XML",
]
license = "MIT"

dependencies = [
    "zeep>=4.3.0,<4.4.0",
    "requests>=2.32.0,<3.0.0",
    'pyreadline3>=3.5.4,<4.0.0; sys_platform == "win32"',
]

[project.urls]
Homepage = "https://github.com/nirsimetri/onvif-python"
Documentation = "https://nirsimetri.github.io/onvif-python"
Changelog = "https://github.com/nirsimetri/onvif-python/releases"
Issues = "https://github.com/nirsimetri/onvif-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<7.0",
    "black>=26.0,<27.0",
    "mypy>=1.0,<2.0",
    "isort>=6.0,<7.0",
    "pylint>=4.1.2,<4.3.0",
    "pylint-pytest>=1.1,<2.0",
    "docformatter>=1.0,<2.0",
    "codespell>=2.0,<3.0",
    "lxml-stubs",
    "types-setuptools",
    "types-requests",
]
docs = [
    "mkdocs-material>=9.7.7,<10.0.0",
    "mkdocstrings[python]>=1.0.0,<3.0.0",
    "mkdocs-git-authors-plugin>=0.10.0,<1.0.0",
    "mkdocs-git-revision-date-localized-plugin>=1.6.0,<2.0.0",
    "mkdocs-minify-plugin>=0.8.0,<1.0.0",
]

[project.scripts]
onvif = "onvif.cli.main:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["onvif*"]
exclude = [
    "examples*",
    "tests*",
    "assets*",
    "build*",
    "site*",
    "device-test*",
]

[tool.setuptools.package-data]
onvif = [
    "wsdl/**/*",
    "db/**/*",
]

[tool.black]
line-length = 88
target-version = ['py310']
extend-exclude = '''
/(
    assets
)/
'''

[tool.isort]
profile = "black"
skip  = [
    "^assets/",
    "^temp/",
    "^build/",
    "^site/",
]

[tool.docformatter]
wrap-summaries = 88  # --black
wrap-descriptions = 88  # --black
pre-summary-newline = true
close-quotes-on-newline = true

[tool.pylint.main]
extension-pkg-allow-list = [
    "lxml",
]
ignore-paths = [
    "^examples/",
    "^assets/",
    "^temp/",
    "^build/",
    "^site/",
]
load-plugins = ["pylint_pytest"]

[tool.pylint.format]
max-line-length = 130

[tool.pylint."messages control"]
disable = [
    "C0103",  # invalid-name
    "R0801",  # duplicate-code
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0904",  # too-many-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
]

[tool.mypy]
explicit_package_bases = true
exclude  = [
    "^examples/",
    "^assets/",
    "^temp/",
    "^build/",
    "^site/",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "device-test/*",
    "examples/*",
    "docs/*",
]

[tool.codespell]
skip = "*.wsdl, *.xsd, *.xsl, *.html, *.json, *.js, *.css, *.map"
count = true
quiet-level = 3