name: Python Application

on:
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - "onvif/**"
      - "tests/**"
      - "examples/**"

permissions:
  contents: read

env:
  COVERAGE_FAIL_UNDER: 49  # Will be raised gradually (in percentage)
  MIN_PYTHON_VERSION: "3.10"  # Use the minimum supported Python version for coverage generation

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install project
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Check formatting with black
      run: black --check .

    - name: Check imports order with isort
      run: isort --check-only .

    - name: Lint with pylint
      run: pylint .

    - name: Type check with mypy
      run: mypy .

    - name: Test and coverage check with pytest
      run: |
        if [ "${{ matrix.python-version }}" = "${{ env.MIN_PYTHON_VERSION }}" ]; then
          pytest --cov=onvif --cov-fail-under=${{ env.COVERAGE_FAIL_UNDER }} --cov-report=term-missing
        else
          pytest .
        fi
