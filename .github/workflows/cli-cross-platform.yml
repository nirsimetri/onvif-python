name: CLI Cross-Platform

on:
  push:
    branches: [ "main" ]
    paths:
      - "onvif/**"
      - "pyproject.toml"
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - "onvif/**"
      - "pyproject.toml"

env:
  MIN_PYTHON_VERSION: "3.10"

jobs:
  cli-test:
    name: CLI Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
          - ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python ${{ env.MIN_PYTHON_VERSION }} (${{ matrix.os }})
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.MIN_PYTHON_VERSION }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Test CLI
        run: |
          onvif --help
          onvif --version